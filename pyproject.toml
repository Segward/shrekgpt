[project]
name = "shrekgpt"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2.5.4",
  "torch>=2.14.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "Darwin"

[tool.ruff.lint.isort]
known-first-party = ["main"]

[project.scripts]
shrekgpt = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/main.py"]
sources = ["src"]
